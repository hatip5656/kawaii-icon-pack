name: Preview site

# Manual only. GitHub Pages has to be switched on for the repository first —
# a workflow cannot create the site when the default token is read-only, and
# running this on every push just paints the repo red. Once either
#   Settings → Pages → Source = GitHub Actions          (creates the site), or
#   Settings → Actions → General → Workflow permissions = Read and write
#                                                       (lets enablement do it)
# is set, run this workflow once and put the push trigger back.
on:
  workflow_dispatch:

# configure-pages enables Pages itself (enablement: true below); if the API
# call is refused, set Settings → Pages → Source = GitHub Actions by hand.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # preview/index.html is generated, not committed — it is 4 MB of inlined SVG
      - name: Build the preview
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp preview/index.html _site/index.html

      # enablement asks the API to create the Pages site. It only works when the
      # repository's default workflow token is read/write — a permissions: block
      # can narrow that default but never exceed it. If this step reports
      # "Resource not accessible by integration", fix it in repository settings:
      #   Settings → Actions → General → Workflow permissions → Read and write
      #   Settings → Pages → Source → GitHub Actions
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
