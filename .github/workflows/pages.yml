name: Preview site

on:
  push:
    branches: [main]
  workflow_dispatch:

# One-time setup: Settings → Pages → Source = GitHub Actions.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # preview/index.html is generated, not committed — it is 4 MB of inlined SVG
      - name: Build the preview
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp preview/index.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
